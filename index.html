  let stackBase=0;if(stacks)stackBase=R(stacks<=5?'stackBase5':stacks<=20?'stackBase20':'stackBaseOver');

  let stackReport=stackMeasurements*.1;if(stackReport)add('Emisyon','Baca ölçüm raporlama (%10)',1,stackReport);
  let ambientMeasures=0,ambientBase=0,ambientModels=0,ambientReport=0;
  if(ambient.length){
    ambientBase=R('ambBase');add('İmisyon','Ortak imisyon taban bedeli',1,ambientBase,'00UEJ/02UEK/01UEK için ortak, bir kez');
    for(const p of COMMON_PLAN){
      if(p.id==='fallModel'||p.id==='airModel'){ambientModels+=R(p.id);add('İmisyon',p.name,1,R(p.id));}
      else if(p.id==='merc'){ambientMeasures+=R('merc');add('İmisyon','Merkaptan · 20 noktada tek tur',1,R('merc'),'Tarife birimi işletme; laboratuvar teyidi bekliyor');}
      else{const qty=p.points*p.rounds;ambientMeasures+=qty*R(p.id);add('İmisyon',p.name,qty,R(p.id),'Kaynak/nokta eşleştirmesi laboratuvar teyidi bekliyor');}
    }
    ambientReport=ambientMeasures*.1;if(ambientReport)add('İmisyon','Ortam ölçümleri raporlama (%10)',1,ambientReport);
  }
  let extra=0;
  for(const row of(state.custom||[])){
    if(!selected.has(row.facilityId))continue;
    if(row.scope==='water'&&!waterAllowed)continue;
    if(row.scope==='air'&&!airAllowed)continue;
    const n=(Number(row.quantity)||0)*(Number(row.rounds)||1);
    const price=Number(row.price)||0;
    extra+=n*price;add('Özel',row.name+' · '+row.facilityId,n,price,'Özel kalem, raporlama eklenmedi; kontrol edilmeli');
  }
  const lab=waterSamples+waterAnalyses+waterBase+waterReport+stackMeasurements+stackBase+stackReport+ambientMeasures+ambientBase+ambientModels+ambientReport+extra;
  const trip=(Number(state.settings.distance)||0)*2*(Number(state.settings.kmPrice)||0);
  const groups=[water.length>0,stack.length>0,ambient.length>0].filter(Boolean).length;
  const separateTrip=trip*((water.length?1:0)+(stack.length?1:0)+(ambient.length?3:0));
  // Scenario mode: shared first-trip is conditional on laboratory/MELBES confirmation.
  const sharedTrip=groups?trip*(1+(ambient.length?2:0)):0;
  const travel=state.settings.travelMode==='shared'?sharedTrip:separateTrip;
  const actual=(state.expenses||[]).filter(e=>e.scenarioId===scenario.id).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const vatRate=(Number(state.settings.vat)||0)/100;
  return {selectedCount:facilities.length,waterCount:water.length,stackCount:stack.length,ambientCount:ambient.length,exceptions,lab,travel,total:lab+travel,vat:(lab+travel)*vatRate,gross:(lab+travel)*(1+vatRate),actual,details,stacks,waterPoints:water.reduce((s,f)=>s+Number(f.points||0),0),separateTrip,sharedTrip,waterAnalyses,waterSamples,waterBase,waterReport,stackMeasurements,stackBase,stackReport,ambientMeasures,ambientBase,ambientModels,ambientReport,customTotal:extra};
}

function timeline(){const first=monthFormat(db.settings.firstMonth),second=monthFormat(addMonth(db.settings.firstMonth));return `${header('İzin ve Ölçüm Takvimi','GFB başvuru hedefinden aylık numune kampanyalarına uzanan planlama.',btn('Yazdır','print'))}<div class="grid kpis" style="grid-template-columns:repeat(3,1fr)">${kp('GFB başvuru hedefi',e(active().gfbMonth||'Belirsiz'),'Başvuru tarihi, onay tarihi değildir','▦')}${kp('İlk kampanya',e(first),'Tüm ilk çalışmalar aynı gün başlar','◉')}${kp('İkinci kampanya',e(second),'VOC ve çöken toz başlangıcı','↗')}</div><div class="card section-card"><div class="card-head"><h2>Planlanan kilometre taşları</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Dönem</th><th>İşlem</th><th>Not</th><th>Durum</th></tr></thead><tbody><tr><td><b>${e(active().gfbMonth||'Belirsiz')}</b></td><td>GFB başvurusu</td><td>Hava/deşarj kapsamı kullanıcı seçimine göre</td><td>${pp('Hedef','amber')}</td></tr><tr><td><b>${e(first)}</b></td><td>D-01 / D-02 su numuneleri; baca ölçümleri; PM10; merkaptan; VOC-1; çöken toz-1</td><td>İlk çalışmalar aynı gün başlatılır; 24 saatlik ve aylık ölçümler devam eder</td><td>${pp('Planlanan','blue')}</td></tr><tr><td><b>${e(second)}</b></td><td>VOC-2 ve çöken toz-2</td><td>İkinci dönem aynı gün başlar</td><td>${pp('Planlanan','blue')}</td></tr><tr><td><b>Belirsiz</b></td><td>GFB'nin verilmesi</td><td>Resmî onay tarihi bilinmiyor; süreler yalnızca gerçek onayla hesaplanır</td><td>${pp('Doğrulama bekliyor','amber')}</td></tr></tbody></table></div><div class="notice info"><strong>Tarih ve mevzuat uyarısı</strong>Bir GFB paketine tesis seçilmesi hukuki uygunluk kararı değildir. GFB sonrası yapılacak çevre izni başvurusu için güncel mevzuattaki süre ve ön koşullar resmî tarih ve belgelere göre kontrol edilmelidir.</div></div>`}
function expenses(){const sum=db.expenses.filter(x=>x.scenarioId===active().id).reduce((x,r)=>x+Number(r.amount),0);return `${header('Harcama Takibi','Planlanan asgari ücretlerin yanında gerçekleşen giderleri ayrıca kaydet.',btn('＋ Gider kaydet','new-expense','btn-primary'))}<div class="grid kpis" style="grid-template-columns:repeat(3,1fr)">${kp('Gerçekleşen gider',money(sum),'Aktif senaryo kayıtları','₺')}${kp('Planlanan laboratuvar',money(calc().lab),'KDV hariç ve ulaşım hariç','◉')}${kp('Kayıt sayısı',fmt(db.expenses.filter(x=>x.scenarioId===active().id).length),'Bu senaryoya ait giderler','▤')}</div><div class="card section-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Tarih</th><th>Açıklama</th><th>Kategori</th><th class="num">Tutar</th><th>İşlem</th></tr></thead><tbody>${db.expenses.filter(x=>x.scenarioId===active().id).map(x=>`<tr><td>${e(x.date)}</td><td>${e(x.name)}</td><td>${e(x.category)}</td><td class="num">${money(x.amount)}</td><td>${btn('Sil','delete-expense:'+x.id,'btn-sm btn-danger')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Bu senaryoda henüz gerçekleşen harcama kaydı yok.</td></tr>'}</tbody></table></div></div><div class="notice info">Gerçekleşen giderler, asgari tarife üzerinden hesaplanan tahmini bütçeye otomatik eklenmez. Mükerrer sayımı önlemek için ayrı izlenir.</div>`}
function settings(){return `${header('Ayarlar ve Veriler','Maliyet varsayımları, veri yedekleme ve raporlar.',btn('⬇ Yedek indir','export-backup','btn-primary'))}<div class="card section-card"><div class="card-head"><h2>Hesaplama varsayımları</h2></div><div class="config-grid"><label><span class="label">KDV (%)</span><input data-setting="vat" type="number" min="0" max="100" step="0.1" value="${e(db.settings.vat)}"></label><label><span class="label">Tek yön mesafe (km)</span><input data-setting="distance" type="number" min="0" value="${e(db.settings.distance)}"></label><label><span class="label">Yol bedeli (TL/km/yön)</span><input data-setting="kmPrice" type="number" min="0" step="0.01" value="${e(db.settings.kmPrice)}"></label><label><span class="label">Tarife referans yılı</span><input data-setting="tariffYear" type="number" min="2026" value="${e(db.settings.tariffYear)}"></label><label><span class="label">İlk ölçüm dönemi</span><input data-setting="firstMonth" type="month" value="${e(db.settings.firstMonth)}"></label><label><span class="label">Ulaşım planı</span><select data-setting="travelMode"><option value="separate" ${db.settings.travelMode==='separate'?'selected':''}>İhtiyatlı, ayrı ücret</option><option value="shared" ${db.settings.travelMode==='shared'?'selected':''}>Koordineli ulaşım (koşullu)</option></select></label></div><div class="notice"><strong>Ulaşım varsayımı</strong>2.000 km tek yön yalnızca ihtiyatlı bütçe varsayımıdır. Ortak seyahat modeli ve imisyon ölçümlerinde üç kat yol hesabı laboratuvar/MELBES tarafından doğrulanmalıdır.</div></div><div class="card section-card" style="margin-top:16px"><div class="card-head"><h2>Veri yedekleme / aktarma</h2></div><p class="subtitle">Bu sürüm kullanıcı verilerini yalnızca bu tarayıcıda saklar. Farklı cihazda kullanmak veya veriyi korumak için JSON yedeği indirip içe aktar.</p><div class="actions" style="margin:20px 0">${btn('⬇ JSON yedeği indir','export-backup','btn-primary')}${btn('⬆ Yedeği içe aktar','import-backup')}${btn('⬇ CSV detay raporu','export-csv')}${btn('Yazdır','print')}</div><input type="file" id="import-file" accept="application/json,.json" hidden/><div class="notice info"><strong>Çevrimiçi hesap uyarısı</strong>Henüz kullanıcı girişi veya ortak veritabanı yoktur. Tarayıcı geçmişini silersen kayıtlar silinebilir. Kritik saha belgelerini veya hassas bilgileri bu sürüme yükleme.</div><div class="actions" style="margin-top:20px">${btn('Demo/örnek veriye sıfırla','factory-reset','btn-danger')}</div></div>`}
function screen(){return ({dashboard,scenarios,facilities:facilitiesPage,measurements,tariff:tariffs,timeline,expenses,settings}[page]||dashboard)()}
function render(){const n=nav.find(([k])=>k===page);document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">Ç</div><div><strong>Çevre İzin Yönetimi</strong><small>GFB PLANLAMA SİSTEMİ</small></div></div><div class="section-name">Yönetim</div><div class="nav">${nav.map(([key,title])=>`<button type="button" data-nav="${key}" class="${page===key?'active':''}"><span class="iconx">${icon[key]}</span> ${title}</button>`).join('')}</div><div class="side-bottom"><div class="side-status">Yerel kayıt etkin</div><b>2026 Resmî Tarife</b>2027 ölçümleri için yalnızca referans. <br>Tek işletme · Karar destek aracı</div></aside><main class="main"><div class="topbar"><div class="top-left"><span class="crumb">Çevre İzin Yönetim Sistemi</span><span style="color:#d8dfe8">/</span><b style="font-size:12px">${e(n?.[1]||'')}</b></div><div class="top-right"><span>Çalışma modu: <b>Tarayıcıda</b></span><div class="avatar">Çİ</div></div></div><div class="content">${screen()}</div></main></div>${toast?`<div id="toast" style="position:fixed;bottom:20px;right:25px;background:#143f45;color:#fff;padding:12px 18px;border-radius:9px;box-shadow:0 12px 40px #0003;z-index:12">${e(toast)}</div>`:''}${modal?`<div class="pop-overlay" id="overlay"><div class="modal">${modalContent()}</div></div>`:''}`}
function modalContent(){const close='<button class="xbtn" type="button" data-action="close-modal">×</button>';
 if(modal.type==='new-scenario'||modal.type==='edit-scenario'){
 const old=modal.item||{id:'',name:'',status:'Taslak',scope:'both',gfbMonth:'2027-01'};return `<div class="modal-top"><h2>${modal.type==='new-scenario'?'Yeni senaryo':'Senaryo düzenle'}</h2>${close}</div><form id="modal-form" onsubmit="return false"><div class="form-row"><label class="field"><span class="label">Senaryo kodu</span><input name="id" required maxlength="30" value="${e(old.id)}" ${modal.type==='edit-scenario'?'readonly':''}></label><label class="field"><span class="label">GFB hedef ayı</span><input type="month" name="gfbMonth" value="${e(old.gfbMonth)}"></label></div><label class="field"><span class="label">Senaryo adı</span><input name="name" required value="${e(old.name)}"></label><div class="form-row"><label class="field"><span class="label">İzin konusu</span><select name="scope"><option value="both" ${old.scope==='both'?'selected':''}>Hava + Deşarj</option><option value="water" ${old.scope==='water'?'selected':''}>Yalnız deşarj</option><option value="air" ${old.scope==='air'?'selected':''}>Yalnız hava</option></select></label><label class="field"><span class="label">Durum</span><select name="status"><option>Taslak</option><option ${old.status==='Değerlendirmede'?'selected':''}>Değerlendirmede</option><option ${old.status==='Arşiv'?'selected':''}>Arşiv</option><option ${old.status==='DEMO'?'selected':''}>DEMO</option></select></label></div><div class="modal-actions">${btn('İptal','close-modal')}<button class="btn btn-primary" type="button" data-action="save-modal">Kaydet</button></div></form>`;}
 if(modal.type==='new-facility'||modal.type==='edit-facility'){
 const f=modal.item||{id:'',name:'',kind:'water',group:'D-01',date:'',points:1,sample:'c2',analyses:[],note:''};return `<div class="modal-top"><h2>${modal.type==='new-facility'?'Yeni tesis ekle':'Tesis düzenle'}</h2>${close}</div><form id="modal-form" onsubmit="return false"><div class="form-row"><label class="field"><span class="label">Tesis kodu</span><input name="id" required maxlength="35" value="${e(f.id)}" ${modal.type==='edit-facility'?'readonly':''}></label><label class="field"><span class="label">Tesis türü</span><select name="kind">${Object.entries(typeLabel).map(([k,v])=>`<option value="${k}" ${f.kind===k?'selected':''}>${e(v)}</option>`).join('')}</select></label></div><label class="field"><span class="label">Tesis adı</span><input name="name" required maxlength="120" value="${e(f.name)}"></label><div class="form-row"><label class="field"><span class="label">Grup</span><select name="group">${['D-01','D-02','EMISYON','ORTAK-HAVA','YENI'].map(k=>`<option ${f.group===k?'selected':''}>${k}</option>`).join('')}</select></label><label class="field"><span class="label">Planlanan işletmeye alma</span><input name="date" type="date" value="${e(f.date)}"></label><label class="field"><span class="label">Numune / baca çıkışı sayısı</span><input name="points" type="number" min="0" max="500" value="${e(f.points)}"></label><label class="field"><span class="label">Numune tipi</span><select name="sample"><option value="" ${!f.sample?'selected':''}>Özel / tanımlanmadı</option><option value="c2" ${f.sample==='c2'?'selected':''}>2 saatlik kompozit</option><option value="c24" ${f.sample==='c24'?'selected':''}>24 saatlik kompozit</option></select></label></div><label class="field"><span class="label">Açıklama</span><textarea rows="2" name="note">${e(f.note)}</textarea></label><div class="field-note">Yeni tesis için ölçüm kalemlerini ayrıca “Ölçüm & Analizler → Parametre ekle” bölümünden tanımla. Mevcut tesisin parametreleri korunur.</div><div class="modal-actions">${btn('İptal','close-modal')}<button class="btn btn-primary" type="button" data-action="save-modal">Kaydet</button></div></form>`;}
 if(modal.type==='new-param')return `<div class="modal-top"><h2>Yeni analiz / parametre</h2>${close}</div><form id="modal-form" onsubmit="return false"><label class="field"><span class="label">Tesis</span><select name="facilityId" required>${db.facilities.map(f=>`<option value="${e(f.id)}">${e(f.id)} · ${e(f.name)}</option>`).join('')}</select></label><label class="field"><span class="label">Parametre / hizmet adı</span><input name="name" required placeholder="Örn. Ek modelleme veya parametre"></label><div class="form-row"><label class="field"><span class="label">İzin grubu</span><select name="scope"><option value="water">Deşarj</option><option value="air">Hava</option><option value="both">Her ikisi</option></select></label><label class="field"><span class="label">Miktar (nokta/numune)</span><input name="quantity" type="number" min="0" value="1" required></label><label class="field"><span class="label">Tekrar</span><input name="rounds" type="number" min="1" value="1" required></label><label class="field"><span class="label">Birim bedel (TL)</span><input name="price" type="number" min="0" step="0.01" value="0" required></label></div><div class="notice info">Bu parametre yalnızca tesisin dahil edildiği senaryolarda fiyatlanır. Raporlama ek bedeli gerekiyorsa ayrı kalem olarak tanımla. Yetkili idare gerekliliği doğrulanmalıdır.</div><div class="modal-actions">${btn('İptal','close-modal')}<button type="button" data-action="save-modal" class="btn btn-primary">Parametreyi ekle</button></div></form>`;
 if(modal.type==='new-expense')return `<div class="modal-top"><h2>Gerçekleşen gider ekle</h2>${close}</div><form id="modal-form" onsubmit="return false"><div class="form-row"><label class="field"><span class="label">Tarih</span><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span class="label">Kategori</span><select name="category"><option>Laboratuvar</option><option>Ulaşım</option><option>Resmî harç</option><option>Danışmanlık</option><option>Diğer</option></select></label></div><label class="field"><span class="label">Açıklama</span><input name="name" required></label><label class="field"><span class="label">Ödenen tutar (TL, KDV dahil)</span><input type="number" name="amount" min="0" step="0.01" required></label><div class="modal-actions">${btn('İptal','close-modal')}<button type="button" data-action="save-modal" class="btn btn-primary">Gideri kaydet</button></div></form>`;
 if(modal.type==='details'){const c=calc();return `<div class="modal-top"><h2>Ayrıntılı maliyet özeti</h2>${close}</div><p class="subtitle">${e(active().name)}</p>${results(c)}<div class="modal-actions">${btn('Kapat','close-modal')}${btn('CSV indir','export-csv','btn-primary')}</div>`;}
 return close;
}
function download(filename,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csvFile(){const c=calc();const cells=[['Grup','Parametre','Miktar','Birim Fiyat TL','Toplam TL','Not'],...c.details.map(d=>[d.category,d.name,d.quantity,d.unitPrice,d.total,d.note]),['TOPLAM','Laboratuvar',1,c.lab,c.lab,'2026 referans'],['TOPLAM','Ulaşım',1,c.travel,c.travel,'varsayım'],['TOPLAM','KDV dahil',1,c.gross,c.gross,'ön bütçe']];download('GFB_'+active().id+'_maliyet.csv','\ufeff'+cells.map(row=>row.map(val=>'"'+String(val??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function handleAction(name){const [key,id]=name.split(':');const s=active();
if(key==='save-modal'){const form=document.getElementById('modal-form');if(form&&form.reportValidity())submitForm(form);return;}
if(key==='new-scenario'){modal={type:'new-scenario'};render();return;}
if(key==='edit-scenario'){modal={type:'edit-scenario',item:db.scenarios.find(x=>x.id===id)};render();return;}
if(key==='open-scenario'){db.active=id;page='dashboard';save();return;}
if(key==='copy-scenario'){const original=db.scenarios.find(x=>x.id===id);let i=1,newId;do{newId='SC-'+String(i).padStart(2,'0');i++}while(db.scenarios.some(x=>x.id===newId));db.scenarios.push({...structuredClone(original),id:newId,name:original.name+' (kopya)',status:'Taslak'});db.active=newId;page='dashboard';save();return;}
if(key==='delete-scenario'){if(db.scenarios.length<=1){note('Son senaryo silinemez.');return;}if(confirm(id+' senaryosunu silmek istiyor musun?')){db.scenarios=db.scenarios.filter(x=>x.id!==id);db.expenses=db.expenses.filter(x=>x.scenarioId!==id);if(db.active===id)db.active=db.scenarios[0].id;save();}return;}
if(key==='new-facility'){modal={type:'new-facility'};render();return;}
if(key==='edit-facility'){modal={type:'edit-facility',item:db.facilities.find(x=>x.id===id)};render();return;}
if(key==='delete-facility'){if(confirm(id+' tesisini silmek istiyor musun?')){db.facilities=db.facilities.filter(x=>x.id!==id);db.scenarios.forEach(x=>x.selected=x.selected.filter(j=>j!==id));db.custom=db.custom.filter(x=>x.facilityId!==id);save();}return;}
if(key==='new-param'){modal={type:'new-param'};render();return;}
if(key==='delete-param'){if(confirm('Bu parametre kaydını silmek istiyor musun?')){db.custom=db.custom.filter(x=>x.id!==id);save();}return;}
if(key==='new-expense'){modal={type:'new-expense'};render();return;}
if(key==='delete-expense'){if(confirm('Gider kaydı silinsin mi?')){db.expenses=db.expenses.filter(x=>x.id!==id);save();}return;}
if(key==='select-all'){s.selected=db.facilities.map(f=>f.id);save();return;}
if(key==='clear-all'){s.selected=[];save();return;}
if(key==='go-scenarios'){page='scenarios';render();return;}
if(key==='print'){window.print();return;}
if(key==='show-details'){modal={type:'details'};render();return;}
if(key==='close-modal'){modal=null;render();return;}
if(key==='export-backup'){download('GFB_Yedek_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');return;}
if(key==='import-backup'){document.getElementById('import-file')?.click();return;}
if(key==='export-csv'){csvFile();return;}
if(key==='reset-prices'){if(confirm('Tarife fiyatlarını orijinal 2026 değerlerine sıfırlamak istiyor musun?')){db.prices=Object.fromEntries(PRICES.map(p=>[p.id,p.price]));save();}return;}
if(key==='factory-reset'){if(confirm('TÜM yerel senaryolar, tesisler, fiyat değişiklikleri ve gider kayıtları silinecek. Önce yedek indirdiğine emin misin?')){db=newState();page='dashboard';save();}return;}}
function submitForm(form){const entries=Object.fromEntries(new FormData(form));
if(modal.type==='new-scenario'||modal.type==='edit-scenario'){
let id=entries.id.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'-');if(!id){alert('Geçerli bir senaryo kodu yaz.');return;}if(modal.type==='new-scenario'&&db.scenarios.some(x=>x.id===id)){alert('Senaryo kodu zaten kayıtlı.');return;}
const row={id,name:entries.name.trim(),scope:entries.scope,gfbMonth:entries.gfbMonth||'',status:entries.status||'Taslak'};
if(modal.type==='new-scenario'){db.scenarios.push({...row,selected:[]});db.active=id;}else{Object.assign(db.scenarios.find(x=>x.id===id),row)};}
if(modal.type==='new-facility'||modal.type==='edit-facility'){
const id=entries.id.trim().toUpperCase().replace(/\s+/g,'');if(modal.type==='new-facility'&&db.facilities.some(x=>x.id===id)){alert('Bu kodda bir tesis var.');return;}
const row={id,name:entries.name.trim(),kind:entries.kind,group:entries.group,date:entries.date||'',points:Number(entries.points),sample:entries.sample||'',note:entries.note.trim()};
if(modal.type==='new-facility')db.facilities.push({...row,analyses:[]});else Object.assign(db.facilities.find(x=>x.id===id),row);}
if(modal.type==='new-param'){db.custom.push({id:uid('param'),facilityId:entries.facilityId,name:entries.name.trim(),scope:entries.scope,quantity:Number(entries.quantity),rounds:Number(entries.rounds),price:Number(entries.price)});}
if(modal.type==='new-expense'){db.expenses.push({id:uid('gider'),scenarioId:active().id,date:entries.date,category:entries.category,name:entries.name,amount:Number(entries.amount)});}
modal=null;save();}
document.addEventListener('click',(ev)=>{const n=ev.target.closest('[data-nav]');if(n){page=n.dataset.nav;search='';typeFilter='all';modal=null;render();return;}const a=ev.target.closest('[data-action]');if(a)handleAction(a.dataset.action);else if(ev.target.id==='overlay'){modal=null;render();}});
document.addEventListener('change',(ev)=>{const t=ev.target;
if(t.dataset.toggleFacility){const sel=new Set(active().selected);if(t.checked)sel.add(t.dataset.toggleFacility);else sel.delete(t.dataset.toggleFacility);active().selected=[...sel];save();return;}
if(t.id==='scenario-picker'){db.active=t.value;save();return;}
if(t.id==='scope-picker'){active().scope=t.value;save();return;}
if(t.id==='type-filter'){typeFilter=t.value;render();return;}
if(t.dataset.price){const n=Number(t.value);if(Number.isFinite(n)&&n>=0){db.prices[t.dataset.price]=n;save();}return;}
if(t.dataset.setting){const k=t.dataset.setting;db.settings[k]=['vat','distance','kmPrice','tariffYear'].includes(k)?Number(t.value):t.value;save();return;}
if(t.id==='import-file'){
const file=t.files?.[0];if(!file)return;file.text().then(txt=>{const o=JSON.parse(txt);if(!Array.isArray(o.facilities)||!Array.isArray(o.scenarios)||!o.settings||!o.prices)throw Error('Geçersiz GFB yedek dosyası');if(confirm('Mevcut kayıtlar bu yedekle değiştirilecek. Devam edilsin mi?')){db=o;db.custom??=[];db.expenses??=[];db.active=db.scenarios.find(x=>x.id===db.active)?.id||db.scenarios[0].id;page='dashboard';save();}}).catch(err=>alert('Dosya içe aktarılamadı: '+err.message));}
});
document.addEventListener('input',(ev)=>{if(ev.target.id==='facility-search'){search=ev.target.value;const el=document.getElementById('facility-list');if(el)el.innerHTML=facilitiesGrouped();}});
document.addEventListener('submit',(ev)=>{if(ev.target.id==='modal-form'){ev.preventDefault();submitForm(ev.target);}});
render();

</script></body></html>
